# ساخت فایل نصب اندروید (APK) روی سرورهای GitHub.
# خروجی: در صفحهٔ Actions ← همین اجرا ← بخش Artifacts ← dakhl-o-kharj-debug-apk
name: Android APK

on:
  push:
    branches: [main, claude/phase-1-ui]
    paths: ['client/**', '.github/workflows/android.yml', 'package-lock.json']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Android SDK روی سرورهای ubuntu-latest از پیش نصب است (ANDROID_HOME)؛ Gradle بسته‌های لازم را خودش می‌گیرد
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Install packages
        run: npm ci --no-audit --no-fund

      - name: Test app logic
        run: npm test -w client

      - name: Build web app
        run: npm run build -w client

      - name: Copy web app into Android project
        working-directory: client
        run: npx cap sync android

      - name: Build debug APK
        working-directory: client/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: dakhl-o-kharj-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
